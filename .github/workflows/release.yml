name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that package.json matches the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json is $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Fetch the tag with its message
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ -z "$note" ]; then
            note="$(git log -1 --format=%s "$GITHUB_REF_NAME")"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$note" --verify-tag
